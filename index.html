<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        /* Add any relevant styles here */
    </style>
    <script>
        function validateForm() {
            const name = document.forms["contactForm"]["name"].value;
            const email = document.forms["contactForm"]["email"].value;
            const message = document.forms["contactForm"]["message"].value;

            let valid = true;
            let errorMsg = "";

            if (name === "") {
                valid = false;
                errorMsg += "Name must be filled out\n";
            }
            if (email === "") {
                valid = false;
                errorMsg += "Email must be filled out\n";
            }
            if (message === "") {
                valid = false;
                errorMsg += "Message must be filled out\n";
            }

            if (!valid) {
                alert(errorMsg);
            }
            return valid;
        }

        function showSuccess() {
            alert("Form submitted successfully!");
        }
    </script>
</head>
<body>
    <h1>Contact Us</h1>
    <form name="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" onsubmit="return validateForm()">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message"></textarea><br>
        <input type="submit" value="Submit" onclick="showSuccess()">
    </form>
</body>
</html>
