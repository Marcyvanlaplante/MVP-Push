<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxurious Design 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #f0f4f8, #d9e2ec);
        }
        header {
            text-align: center;
            padding: 50px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 48px;
            color: #333;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            color: #fff;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.5s ease;
        }
        button:hover {
            background: linear-gradient(to right, #feb47b, #ff7e5f);
        }
        footer {
            margin-top: 50px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Luxurious Design 2026</h1>
    </header>
    <div class="container">
        <p>Experience the modern features, animations, and premium UI!</p>
        <button>Get Started</button>
    </div>
    <footer>
        <p>&copy; 2026 Luxurious Design. All rights reserved.</p>
    </footer>
</body>
</html>
